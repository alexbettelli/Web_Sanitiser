[workspace]
resolver = "2"
members = [
    "sanitiser-core",
    "sanitiser-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Alex Bettelli"]

[workspace.dependencies]
url = "2.5.8"
walkdir = "2.5.0"
reqwest = { version = "0.13.5", default-features = false, features = [
    "native-tls",
    "stream",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
anyhow = "1.0.104"
clap = { version = "4.6.1", features = ["derive", "env"] }